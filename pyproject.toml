[project]
name = "fin-ledger"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uuid7>=0.1.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "pre-commit>=3.7.0",
    "pytest-asyncio>=1.4.0",
    "pytest-env>=1.7.1",
    "httpx>=0.28.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.pytest_env]
DATABASE_URL="postgresql+asyncpg://test:test@localhost:1/none"
DEBUG="True"
COOKIE_SECURE="True"
SESSION_IDLE_TIMEOUT_SECONDS=1800
SESSION_MAX_LIFETIME_SECONDS=86400
